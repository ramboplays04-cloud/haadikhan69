<body>
<header><div class="brand">HAADIKHAN<span>69</span></div><div id="sync"></div></header>
<main id="app"><div class="empty"><span class="spin"></span> Loading…</div></main>
<nav class="bottom" id="nav">
  <a href="#home" data-r="home"><span class="i">🏠</span>Home</a>

  <a href="#settings" data-r="settings"><span class="i">⚙️</span>Settings</a>

<div id="toast"></div>

<script>
"use strict";
// ---------------------------------------------------------------- storage
const LS = {
  // own key names, so this app never mixes with another tool on the same website (e.g. /autoposter)
  get(k){ try{ return localStorage.getItem("hk69_"+k) || ""; }catch(e){ return ""; } },
  set(k,v){ try{ localStorage.setItem("hk69_"+k, v); }catch(e){} }
};
function guessRepo(){
  const h = location.hostname, seg = location.pathname.split("/").filter(Boolean)[0];
  if (h.endsWith(".github.io")) return h.replace(".github.io","") + "/" + (seg || h);
  return "";
}
const S = { token: LS.get("token"), repo: LS.get("repo") || guessRepo(), pass: LS.get("pass") };
let CFG = null, CFG_SHA = null, STATE = {}, RUNS = [];

// ---------------------------------------------------------------- utils
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = (s, n=80) => { s = String(s||"").replace(/\s+/g," "); return s.length>n ? s.slice(0,n)+"…" : s; };
const enc = (s) => new TextEncoder().encode(s);
const b64e = (u8) => { let s=""; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const b64d = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const utf8b64e = (str) => b64e(enc(str));
const utf8b64d = (b) => new TextDecoder().decode(b64d(b.replace(/\s/g,"")));
let toastT;
function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.className=err?"err":""; t.style.display="block"; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display="none", err?6000:3500); }
function uid(){ return "a" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function userOf(url){ const m=String(url||"").match(/tiktok\.com\/@([^/?#]+)/); return m ? m[1] : String(url||"").replace(/^@/,""); }
function normUrl(t){ t=String(t||"").trim(); if(!t) return ""; if(t.startsWith("http")) return t.split("?")[0].replace(/\/$/,""); return "https://www.tiktok.com/@"+t.replace(/^@/,""); }
function parseTimes(t){ return [...new Set(String(t||"").split(/[,\s]+/).map(p=>{const m=p.match(/^(\d{1,2}):(\d{2})$/); if(!m) return null; const h=+m[1], mi=+m[2]; if(h>23||mi>59) return null; return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0");}).filter(Boolean))].sort(); }

// ---------------------------------------------------------------- crypto (Page tokens password se lock)
async function deriveKey(pass, salt){
  const km = await crypto.subtle.importKey("raw", enc(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptJSON(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, await deriveKey(pass, salt), enc(JSON.stringify(obj))));
  const out = new Uint8Array(28 + ct.length); out.set(salt,0); out.set(iv,16); out.set(ct,28);
  return b64e(out);
}
async function decryptJSON(b64, pass){
  const raw = b64d(b64);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: raw.slice(16,28)}, await deriveKey(pass, raw.slice(0,16)), raw.slice(28));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function getTokens(){
  if (!CFG.tokens_enc) return {};
  try { return await decryptJSON(CFG.tokens_enc, S.pass); }
  catch(e){ throw new Error("Wrong password: enter the same password you used before (Settings)"); }
}

// ---------------------------------------------------------------- phone notifications (Web Push)
const b64u = (u8) => b64e(new Uint8Array(u8)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64uDec = (s) => b64d(s.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((s.length + 3) % 4));
const SW = ("serviceWorker" in navigator) ? navigator.serviceWorker.register("sw.js").catch(() => null) : Promise.resolve(null);
async function pushStatus(){
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window))
    return "Not available here - open the app from its Home Screen icon (iPhone iOS 16.4 or newer)";
  if (Notification.permission === "denied") return "Blocked - iPhone Settings → Notifications → Auto Poster → Allow";
  try { const reg = await SW; const sub = reg && await reg.pushManager.getSubscription(); if (sub && CFG.push_enc) return "ON for this phone ✓"; } catch(e){}
  return "Off";
}
async function enablePush(){
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window))
    throw new Error("Open this app from its Home Screen icon (not Chrome/Safari). iPhone allows notifications only there.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("Notifications not allowed. iPhone Settings → Notifications → Auto Poster → Allow");
  let data = null;
  if (CFG.push_enc) { try { data = await decryptJSON(CFG.push_enc, S.pass); } catch(e){ throw new Error("Wrong password (Settings → Change GitHub token / password)"); } }
  if (!data || !data.vapid_d || !CFG.push_pub){
    const kp = await crypto.subtle.generateKey({ name:"ECDSA", namedCurve:"P-256" }, true, ["sign"]);
    const jwk = await crypto.subtle.exportKey("jwk", kp.privateKey);
    CFG.push_pub = b64u(await crypto.subtle.exportKey("raw", kp.publicKey));
    data = { vapid_d: jwk.d, subs: [] };
  }
  const reg = (await SW) || await navigator.serviceWorker.register("sw.js");
  await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (sub){ const k = sub.options && sub.options.applicationServerKey; if (!k || b64u(k) !== CFG.push_pub){ await sub.unsubscribe(); sub = null; } }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uDec(CFG.push_pub) });
  const j = sub.toJSON();
  data.subs = (data.subs || []).filter(x => x.endpoint !== j.endpoint);
  data.subs.push({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, added: new Date().toISOString().slice(0,10) });
  CFG.push_enc = await encryptJSON(data, S.pass);
  await saveConfig("phone notifications on");
}

// ---------------------------------------------------------------- GitHub API
async function gh(path, opt={}){
  const r = await fetch("https://api.github.com" + path, {
    ...opt, cache: "no-store",
    headers: { "Authorization": "Bearer " + S.token, "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28", ...(opt.headers||{}) }
  });
  if (!r.ok){
    let msg = r.status + "";
    try { msg = (await r.json()).message || msg; } catch(e){}
    if (r.status === 401) msg = "GitHub token is wrong or expired (add a new one in Settings)";
    if (r.status === 404) msg = "Repo or file not found (check the repo name / token permissions)";
    if (r.status === 403) msg = "Token has no permission: " + msg;
    const e = new Error(msg); e.status = r.status; throw e;
  }
  return r.status === 204 ? null : r.json();
}
async function readJSONFile(name){
  const d = await gh(`/repos/${S.repo}/contents/${name}?ref=main&_=${Date.now()}`);
  return { sha: d.sha, data: JSON.parse(utf8b64d(d.content) || "{}") };
}
async function loadAll(){
  $("#sync").innerHTML = '<span class="spin"></span>';
  try {
    const [c, s] = await Promise.all([readJSONFile("config.json"), readJSONFile("state.json").catch(()=>({data:{}}))]);
    CFG = c.data; CFG_SHA = c.sha; STATE = s.data || {};
    CFG.accounts = CFG.accounts || []; CFG.pages = CFG.pages || [];
    gh(`/repos/${S.repo}/actions/runs?per_page=5&_=${Date.now()}`).then(r => { RUNS = r.workflow_runs || []; if (route().name==="home") render(); }).catch(()=>{});
    $("#sync").textContent = STATE.last_run ? "Last run " + STATE.last_run.slice(5) : "";
  } catch(e){ $("#sync").textContent = ""; throw e; }
}
async function saveConfig(msg){
  const body = JSON.stringify(CFG, null, 2) + "\n";
  const put = () => gh(`/repos/${S.repo}/contents/config.json`, { method:"PUT", body: JSON.stringify({ message: msg || "config update (app)", content: utf8b64e(body), sha: CFG_SHA, branch:"main" }) });
  let r;
  try { r = await put(); }
  catch(e){
    if (e.status === 409 || e.status === 422){ const fresh = await readJSONFile("config.json"); CFG_SHA = fresh.sha; r = await put(); }
    else throw e;
  }
  CFG_SHA = r.content.sha;
}
async function dispatch(action, account="", video=""){
  await gh(`/repos/${S.repo}/actions/workflows/autopost.yml/dispatches`, { method:"POST", body: JSON.stringify({ ref:"main", inputs:{ action, account, video } }) });
  toast("Request sent ✓ GitHub will do it in 1-3 minutes. Then pull down to refresh.");
}

// ---------------------------------------------------------------- router
function route(){ const [name, id] = (location.hash.replace("#","") || "home").split("/"); return { name, id }; }
window.addEventListener("hashchange", render);
async function act(fn, btn){
  if (btn){ btn.disabled = true; btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; }
  try { await fn(); } catch(e){ toast(e.message || String(e), true); }
  finally { if (btn && btn.isConnected){ btn.disabled = false; btn.innerHTML = btn.dataset.t; } }
}

const ST_LABEL = {uploaded:["Uploaded","ok"], failed:["Fail","bad"], retry:["Will retry","warn"], new:["Queue","info"], skipped:["Skipped",""]};
function accStats(id){
  const v = ((STATE.accounts||{})[id]||{}).videos || [];
  return { queue: v.filter(x=>x.status==="new"||x.status==="retry").length, up: v.filter(x=>x.status==="uploaded").length,
           fail: v.filter(x=>x.status==="failed").length, last: ((STATE.accounts||{})[id]||{}).last_checked };
}
function allPages(){ const out = [], seen = new Set(); (CFG.pages||[]).concat(STATE.fb_pages||[]).forEach(p => { const k = String(p.id); if (!seen.has(k)) { seen.add(k); out.push(p); } }); return out; }
function pageName(id){ const p = allPages().find(p => String(p.id)===String(id)); return p ? p.name : ""; }

// ---------------------------------------------------------------- views
const V = {};

// Easy login: after the owner sets up once, the GitHub token is saved here locked with the password,
// so anyone with the link only needs the password.
let EASY = null;
async function loadEasy(){
  try { const r = await fetch("login.json?_=" + Date.now(), { cache: "no-store" }); if (r.ok) { const d = await r.json(); if (d && d.token_enc) EASY = d; } } catch(e){}
}
async function saveEasy(){
  const body = JSON.stringify({ repo: S.repo, token_enc: await encryptJSON({ token: S.token }, S.pass) }, null, 1) + "\n";
  let sha; try { sha = (await gh(`/repos/${S.repo}/contents/login.json?ref=main&_=${Date.now()}`)).sha; } catch(e){}
  await gh(`/repos/${S.repo}/contents/login.json`, { method:"PUT", body: JSON.stringify({ message:"easy login", content: utf8b64e(body), branch:"main", ...(sha ? { sha } : {}) }) });
}
V.setup = () => EASY && !S.token ? `
  <h1>Welcome 👋</h1>
  <p class="sub">Enter your password to open the app.</p>
  <div class="card">
    <label>Password</label>
    <input id="s_pass" type="password" autocomplete="current-password">
    <div style="margin-top:16px"><button class="btn primary full" id="s_easy">Open</button></div>
    <div style="margin-top:14px" class="meta"><a href="#" id="s_full">Advanced: enter GitHub details manually</a></div>
  </div>` : `
  <h1>First-time setup</h1>
  <p class="sub">You only need to do this once.</p>
  <div class="card">
    <label>GitHub repo <div class="hint">e.g. <code>faisal123/autoposter</code></div></label>
    <input id="s_repo" value="${esc(S.repo)}" autocapitalize="off" autocorrect="off">
    <label>GitHub token <div class="hint">github.com → Settings → Developer settings → Fine-grained token (Contents + Actions: Read and write)</div></label>
    <input id="s_token" value="${esc(S.token)}" type="password" autocapitalize="off" autocorrect="off" placeholder="github_pat_...">
    <label>Your password <div class="hint">The same one you saved in the GitHub Secret <code>APP_KEY</code>. It locks your Facebook tokens.</div></label>
    <input id="s_pass" value="${esc(S.pass)}" type="password">
    <label class="check"><input type="checkbox" id="s_easyon" checked><span>Easy login on other phones<div class="hint">Other phones can open this app with only the password (the token is saved locked with the password)</div></span></label>
    <div style="margin-top:16px"><button class="btn primary full" id="s_save">Save & connect</button></div>
  </div>`;
V.setup.bind = () => {
  const ez = $("#s_easy");
  if (ez){
    ez.onclick = (e) => act(async () => {
      const pass = $("#s_pass").value; if (!pass) throw new Error("Enter the password");
      let tok; try { tok = (await decryptJSON(EASY.token_enc, pass)).token; } catch(err){ throw new Error("Wrong password"); }
      S.repo = EASY.repo || S.repo; S.token = tok; S.pass = pass;
      await gh(`/repos/${S.repo}`);
      LS.set("repo", S.repo); LS.set("token", S.token); LS.set("pass", S.pass);
      await loadAll(); toast("Welcome ✓"); location.hash = "#home"; render(); await finishFacebookLogin();
    }, e.target);
    $("#s_full").onclick = (e) => { e.preventDefault(); EASY = null; render(); };
    return;
  }
  $("#s_save").onclick = (e) => act(async () => {
    S.repo = $("#s_repo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,"");
    S.token = $("#s_token").value.trim(); S.pass = $("#s_pass").value;
    if (!S.repo || !S.token || !S.pass) throw new Error("Please fill in all three fields");
    await gh(`/repos/${S.repo}`);
    LS.set("repo", S.repo); LS.set("token", S.token); LS.set("pass", S.pass);
    if ($("#s_easyon").checked) { try { await saveEasy(); } catch(err){ toast("Easy login could not be saved: " + err.message, true); } }
    await loadAll(); toast("Connected ✓"); location.hash = "#home"; render(); await finishFacebookLogin();
  }, e.target);
};

V.home = () => {
  let up=0, qu=0, fa=0, today=0; const d = new Date(), td = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  Object.values(STATE.accounts||{}).forEach(a => (a.videos||[]).forEach(v => { if(v.status==="uploaded"){up++; if((v.uploaded||"").startsWith(td)) today++;} if(v.status==="new"||v.status==="retry") qu++; if(v.status==="failed") fa++; }));
  const errs = (STATE.log||[]).filter(l => l.l==="error" && !l.a).slice(0,1);
  const run = RUNS[0];
  const runTxt = run ? (run.status!=="completed" ? '<span class="pill warn">Running now…</span>' : (run.conclusion==="success" ? '<span class="pill ok">Last run OK</span>' : `<span class="pill bad">Last run: ${esc(run.conclusion)}</span>`)) : "";
  return `
  <h1>Dashboard</h1>
  <p class="sub">GitHub runs the tool automatically every ~30 minutes. ${STATE.last_run ? "Last run: "+esc(STATE.last_run) : "No run yet."} ${runTxt}</p>
  <div class="stats">
    <div class="card stat"><div class="n">${today}</div><div class="l">Uploaded today</div></div>
    <div class="card stat"><div class="n">${up}</div><div class="l">Total uploaded</div></div>
    <div class="card stat"><div class="n">${qu}</div><div class="l">In queue</div></div>
    <div class="card stat"><div class="n" style="color:var(--bad)">${fa}</div><div class="l">Failed</div></div>
  </div>
  ${!(CFG.fb_user_enc || CFG.tokens_enc || CFG.make_enc) ? `<div class="card notice"><b>First step:</b> Connect Facebook. <a class="btn small primary" style="margin-left:6px" href="#pages">Connect</a></div>` : (!allPages().length ? `<div class="card notice"><b>Next step:</b> Create a Facebook Page, then tap Refresh my Pages. <a class="btn small primary" style="margin-left:6px" href="#pages">Pages</a></div>` : "")}
  ${(() => { if (!STATE.last_run) return ""; const h = (Date.now() - new Date(STATE.last_run.replace(" ", "T") + ":00+05:00")) / 36e5;
      return h >= 2 ? `<div class="card notice lv-error"><b>⚠ GitHub has not run the tool for ${Math.floor(h)} hours.</b> Tap “Run full check now”. If it keeps happening, tell Claude.</div>` : ""; })()}
  ${CFG.paused ? `<div class="card notice" style="color:var(--warn)"><b>⏸ All uploads are paused.</b> Videos stay in the queue. Tap “Resume all” to start again.</div>` : ""}
  ${STATE.fb_error ? `<div class="card notice lv-error">${esc(STATE.fb_error)}</div>` : ""}

const normName = (t) => String(t||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g, "");
function lev(a, b){
  const m = a.length, n = b.length; if (!m || !n) return Math.max(m, n);
  let prev = Array.from({length: n+1}, (_, j) => j);
  for (let i = 1; i <= m; i++){ const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1)); prev = cur; }
  return prev[n];
}
function matchScore(user, pageName){
  const a = normName(user), b = normName(pageName); if (!a || !b) return 0;
  if (a === b) return 100;
  const sim = 1 - lev(a, b) / Math.max(a.length, b.length);
  let s = sim * 80;
  if (a.includes(b) || b.includes(a)) s = Math.max(s, 70 + 25 * Math.min(a.length, b.length) / Math.max(a.length, b.length));
  const words = String(pageName).toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 3);
  if (words.length){ const hit = words.filter(w => a.includes(w)).length / words.length; s = Math.max(s, 50 + 40 * hit * (hit === 1 ? 1 : 0.8)); }
  return Math.round(s);
}
function autoMatch(users, pages){
  const pairs = [];
  users.forEach((u, i) => pages.forEach(p => pairs.push({ i, id: String(p.id), sc: matchScore(u, p.name) })));
  pairs.sort((x, y) => y.sc - x.sc);
  const res = users.map(() => ({ id: "", sc: 0 })), usedU = new Set(), usedP = new Set();
  for (const p of pairs){ if (p.sc < 60) break; if (usedU.has(p.i) || usedP.has(p.id)) continue; res[p.i] = { id: p.id, sc: p.sc }; usedU.add(p.i); usedP.add(p.id); }
  return res;
}

const FB_SCOPES = "pages_show_list,pages_read_engagement,pages_manage_posts,business_management";
function redirectUri(){ return location.origin + location.pathname; }
async function fbJSON(u){ const r = await fetch(u); const d = await r.json(); if (d.error) throw new Error("Facebook: " + d.error.message); return d; }
async function fbPagesFor(userToken){
  const ver = CFG.graph_version || "v23.0";
  let url = `https://graph.facebook.com/${ver}/me/accounts?fields=id,name,access_token&limit=100&access_token=${encodeURIComponent(userToken)}`, pages = [];
  while (url){ const d = await fbJSON(url); pages = pages.concat(d.data || []); url = (d.paging||{}).next; }
  return pages;
}
async function savePagesFromFacebook(pages, userToken){
  const tokens = await getTokens();

    const ex = CFG.pages.find(x => String(x.id) === String(p.id));
    if (ex) { ex.name = p.name; ex.via = "facebook"; } else CFG.pages.push({ id: p.id, name: p.name, via: "facebook" });
  });
  CFG.tokens_enc = await encryptJSON(tokens, S.pass);
  if (userToken) CFG.fb_user_enc = await encryptJSON({ user_token: userToken }, S.pass);
}

    `&redirect_uri=${encodeURIComponent(redirectUri())}&response_type=token&scope=${FB_SCOPES}` +
    `&state=${encodeURIComponent(sessionStorage.getItem("hk69_fb_state")||"x")}`;
}
async function finishFacebookLogin(){
  let short = ""; try { short = sessionStorage.getItem("hk69_fb_token") || ""; } catch(e){}
  if (!short) return;
  try { sessionStorage.removeItem("hk69_fb_token"); } catch(e){}
  const ver = CFG.graph_version || "v23.0";
  let userToken = short;
  if (CFG.fb_secret_enc){
    const sec = (await decryptJSON(CFG.fb_secret_enc, S.pass)).secret;
    userToken = (await fbJSON(`https://graph.facebook.com/${ver}/oauth/access_token?grant_type=fb_exchange_token&client_id=${encodeURIComponent(CFG.fb_app_id)}&client_secret=${encodeURIComponent(sec)}&fb_exchange_token=${encodeURIComponent(short)}`)).access_token;
  }
  const pages = await fbPagesFor(userToken);
  await savePagesFromFacebook(pages, userToken);
  CFG.fb_connected_at = new Date().toISOString().slice(0, 10);

  toast(`Your Facebook account is connected ✓ ${pages.length} Page${pages.length===1?"":"s"} found`);

  <h2>Your Pages (${pages.length})</h2>
  <div class="card">${pages.length ? pages.map(p => `
    <div class="vid"><div class="name">${esc(p.name)}</div><div class="meta">ID ${esc(p.id)} · ${CFG.accounts.filter(a => String(a.page_id)===String(p.id)).length} TikTok accounts</div>
    <div class="row" style="margin-top:6px"><button class="btn small" data-pt="${esc(p.id)}">Test</button>${CFG.pages.find(x => String(x.id)===String(p.id)) ? `<button class="btn small danger" data-pd="${esc(p.id)}">Hide</button>` : ""}</div></div>`).join("")
    : `<div class="empty">${connected ? "No Pages found yet. Create a Page on Facebook, then tap “Refresh my Pages”." : "Connect Facebook to see your Pages here."}</div>`}</div>

  <details style="margin-top:18px" ${ready ? "" : "open"}><summary class="meta"><b>${ready ? "Facebook app settings" : "One-time setup (needed before the Connect button works)"}</b></summary>
  <div class="card" style="margin-top:10px">
    ${ready ? `<div class="meta">✅ App ID saved: <code>${esc(CFG.fb_app_id)}</code></div>` : `<div class="meta">The Connect button needs your own free Facebook app (from a verified Facebook developer account). Do this once:</div>`}
    <ol class="meta" style="padding-left:18px;margin:10px 0">
      <li>Open <a href="https://developers.facebook.com/apps" target="_blank">developers.facebook.com/apps</a> → <b>Create App</b> → choose the Pages use case (“Manage everything on your Page”).</li>
      <li>In the app go to <b>Facebook Login</b> settings → <b>Valid OAuth Redirect URIs</b> and add this link:<br><code style="word-break:break-all">${esc(redirectUri())}</code> <button class="btn small" id="fb_copyuri">Copy</button></li>
      <li><b>App settings → Basic</b>: copy the <b>App ID</b> and <b>App Secret</b> below and Save.</li>
    </ol>
    <label>App ID</label><input id="fb_appid" inputmode="numeric" value="${esc(CFG.fb_app_id || "")}">
    <label>App Secret <div class="hint">Saved locked with your password</div></label><input id="fb_secret" type="password" placeholder="${CFG.fb_secret_enc ? "•••••• saved" : ""}">
    <div style="margin-top:12px"><button class="btn full" id="fb_saveapp">Save app settings</button></div>
  </div></details>`;
};
V.pages.bind = () => {
  $("#fb_connect").onclick = (e) => act(async () => {
    if (!CFG.fb_app_id) { const d = document.querySelector("details"); if (d) d.open = true; d && d.scrollIntoView({behavior:"smooth"});
      throw new Error("First do the one-time setup below (it needs a verified Facebook developer account)"); }
    if (!CFG.fb_secret_enc) throw new Error("Add the App Secret in the setup below, otherwise the connection expires in 1 hour");
    startFacebookLogin();
  }, e.target);
  const rf = $("#fb_refresh"); if (rf) rf.onclick = (e) => act(async () => {
    if (!CFG.fb_user_enc) throw new Error("Please tap Reconnect Facebook");
    const ut = (await decryptJSON(CFG.fb_user_enc, S.pass)).user_token;
    let pages;
    try { pages = await fbPagesFor(ut); } catch(err){ throw new Error("Facebook connection expired, please tap Reconnect Facebook"); }
    await savePagesFromFacebook(pages, null);
    await saveConfig("refresh pages"); toast(`${pages.length} Page${pages.length===1?"":"s"} found ✓`); render();
  }, e.target);
  const cu = $("#fb_copyuri"); if (cu) cu.onclick = () => { try { navigator.clipboard.writeText(redirectUri()); toast("Link copied ✓"); } catch(e){ toast(redirectUri()); } };
  $("#fb_saveapp").onclick = (e) => act(async () => {
    const id = $("#fb_appid").value.replace(/\D/g, ""), sec = $("#fb_secret").value.trim();
    if (id.length < 8) throw new Error("Enter the App ID (numbers only)");
    CFG.fb_app_id = id;
    if (sec) CFG.fb_secret_enc = await encryptJSON({ secret: sec }, S.pass);
    if (!CFG.fb_secret_enc) throw new Error("Enter the App Secret too");
    await saveConfig("facebook app settings"); toast("Saved ✓ Now tap Connect Facebook"); render();
  }, e.target);
  document.querySelectorAll("[data-pt]").forEach(b => b.onclick = () => act(async () => {
    const t = (await getTokens())[b.dataset.pt]; if (!t) throw new Error("No access for this Page yet. Tap Refresh my Pages or Reconnect Facebook");
    const d = await fbJSON(`https://graph.facebook.com/${CFG.graph_version||"v23.0"}/${b.dataset.pt}?fields=name&access_token=${encodeURIComponent(t)}`);
    toast(`'${d.name}' is connected correctly ✓`);
  }, b));
  document.querySelectorAll("[data-pd]").forEach(b => b.onclick = () => { if (!confirm("Hide this Page from the list?")) return; act(async () => {
    CFG.pages = CFG.pages.filter(p => String(p.id) !== b.dataset.pd);
    CFG.accounts.forEach(a => { if (String(a.page_id) === b.dataset.pd) a.page_id = ""; });
    await saveConfig("hide page"); toast("Page hidden"); render();
  }, b); });
};

let LF = "";
V.logs = () => {
  const users = Object.fromEntries(CFG.accounts.map(a => [a.id, "@" + userOf(a.tiktok) + ": "]));
  const logs = (STATE.log||[]).filter(l => !LF || l.l === LF);
  return `
  <h1>Logs</h1><p class="sub">What the tool did and when.</p>
  <div class="tabs"><button class="btn small ${!LF?"primary":""}" data-lf="">All</button><button class="btn small ${LF==="success"?"primary":""}" data-lf="success">Uploads</button><button class="btn small ${LF==="error"?"primary":""}" data-lf="error">Errors</button><button class="btn small" id="l_ref">↻</button></div>
  <div class="card">${logs.length ? logs.map(l => `<div class="log lv-${esc(l.l)}"><span class="t">${esc(l.t.slice(5))}</span>${esc((users[l.a]||"") + l.m)}</div>`).join("") : `<div class="empty">No logs yet</div>`}</div>
  <h2>GitHub runs</h2>
  <div class="card">${RUNS.length ? RUNS.map(r => `<div class="log"><span class="t">${esc(new Date(r.created_at).toLocaleString())}</span>${esc(r.event)} · ${esc(r.status==="completed" ? r.conclusion : r.status)}</div>`).join("") : `<div class="empty">No runs yet</div>`}
    <div style="margin-top:10px"><a class="btn small" target="_blank" href="https://github.com/${esc(S.repo)}/actions">Full details on GitHub</a></div></div>`;
};
V.logs.bind = () => {
  document.querySelectorAll("[data-lf]").forEach(b => b.onclick = () => { LF = b.dataset.lf; render(); });
  $("#l_ref").onclick = (e) => act(async () => { await loadAll(); render(); }, e.target);
};

V.settings = () => `
  <h1>Settings</h1>
  <div class="card">
    <label>Check TikTok every (minutes)</label><input id="c_chk" type="number" min="30" value="${CFG.check_minutes||60}">
    <label>Latest videos to look at per check</label><input id="c_lim" type="number" min="5" max="200" value="${CFG.scan_limit||30}">
    <label>Retries on failure</label><input id="c_try" type="number" min="1" max="10" value="${CFG.max_attempts||3}">
    <label>Time zone</label><input id="c_tz" value="${esc(CFG.timezone||"Asia/Karachi")}">
    <label>Gap between Pages (minutes) <div class="hint">Pages upload one after another with a random gap in this range, so Facebook doesn't see 30 posts in the same minute. Safe default: 3 to 6.</div></label>
    <div class="row" style="flex-wrap:nowrap"><input id="c_gmin" type="number" min="1" max="30" value="${CFG.gap_min||3}"><span style="align-self:center">to</span><input id="c_gmax" type="number" min="1" max="30" value="${CFG.gap_max||6}"></div>
    <label>Facebook Graph API version <div class="hint">If Facebook retires this version, enter a newer one, e.g. v24.0</div></label><input id="c_ver" value="${esc(CFG.graph_version||"v23.0")}">
    <div style="margin-top:14px"><button class="btn primary full" id="c_save">Save</button></div>
  </div>
  <h2>Phone notifications 🔔</h2>
  <div class="card">
    <div class="meta">Get a notification from <b>this app</b> when videos upload, a video fails, or Facebook pauses uploads. No extra app needed.</div>
    <div class="meta" style="margin-top:8px">Status: <b id="p_stat">checking…</b></div>
    <div class="hint">Open this app from its Home Screen icon (not from Chrome/Safari), then tap the button. iPhone will ask “Allow notifications” → tap Allow.</div>
    <div style="margin-top:10px"><button class="btn primary full" id="p_on">🔔 Turn on notifications on this phone</button></div>
    <div class="row" style="margin-top:8px"><button class="btn small" id="p_test">Send test</button></div>
    <label class="check"><input type="checkbox" id="n_succ" ${CFG.notify_success!==false?"checked":""}><span>Also notify for successful uploads<div class="hint">Errors and Facebook pauses are always sent</div></span></label>
  </div>
  <h2>Connection</h2>
  <div class="card"><div class="meta">Repo: <b>${esc(S.repo)}</b></div><div style="margin-top:10px" class="row"><a class="btn small" href="#setup">Change GitHub token / password</a></div></div>`;
V.settings.bind = () => {
  $("#c_save").onclick = (e) => act(async () => {
    Object.assign(CFG, { check_minutes: Math.max(30, +$("#c_chk").value||60), scan_limit: +$("#c_lim").value||30, max_attempts: +$("#c_try").value||3,
                         timezone: $("#c_tz").value.trim()||"Asia/Karachi", graph_version: $("#c_ver").value.trim()||"v23.0",
                         gap_min: Math.max(1, +$("#c_gmin").value||3), gap_max: Math.max(+$("#c_gmin").value||3, +$("#c_gmax").value||6) });
    await saveConfig("settings"); toast("Saved ✓");
  }, e.target);
  pushStatus().then(t => { const el = $("#p_stat"); if (el) el.textContent = t; });
  $("#p_on").onclick = (e) => act(async () => { await enablePush(); toast("Notifications are ON ✓ Tap Send test"); const el = $("#p_stat"); if (el) el.textContent = await pushStatus(); }, e.target);
  $("#p_test").onclick = (e) => act(async () => {
    if (!CFG.push_enc) throw new Error("First tap Turn on notifications");
    await gh(`/repos/${S.repo}/actions/workflows/autopost.yml/dispatches`, { method:"POST", body: JSON.stringify({ ref:"main", inputs:{ action:"notify_test", account:"", video:"" } }) });
    toast("Test requested ✓ The notification comes in 1-3 minutes");
  }, e.target);
  $("#n_succ").onchange = (e) => act(async () => { CFG.notify_success = e.target.checked; await saveConfig("notifications"); toast("Saved ✓"); });
};

// ---------------------------------------------------------------- render
function render(){
  let { name, id } = route();
  if (!S.token || !S.repo || !S.pass) name = "setup";
  if (name !== "setup" && !CFG) return;
  const view = V[name] || V.home;
  $("#app").innerHTML = view(id);
  if (view.bind) view.bind(id);
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.r === name || (name==="acc"||name==="edit") && a.dataset.r==="home" || name==="bulk" && a.dataset.r==="add"));
  window.scrollTo(0, 0);
}

// neeche kheench kar refresh (pull to refresh)
let y0 = null;
window.addEventListener("touchstart", e => { y0 = window.scrollY === 0 ? e.touches[0].clientY : null; }, { passive: true });
window.addEventListener("touchend", e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 110 && S.token && route().name!=="setup") act(async () => { await loadAll(); render(); toast("Refreshed ✓"); }); y0 = null; });
document.addEventListener("visibilitychange", () => { if (!document.hidden && CFG) loadAll().then(render).catch(()=>{}); });

(function captureFacebookRedirect(){
  const h = location.hash || "", q = new URLSearchParams(location.search);
  if (h.includes("access_token=")) {
    const p = new URLSearchParams(h.slice(1));
    try { sessionStorage.setItem("hk69_fb_token", p.get("access_token") || ""); } catch(e){}
    history.replaceState(null, "", location.pathname + "#pages");
  } else if (q.get("error") || q.get("error_reason")) {
    history.replaceState(null, "", location.pathname + "#pages");
    setTimeout(() => toast("Facebook login was cancelled", true), 800);
  }
})();
(async () => {
  if (!S.token) await loadEasy();
  if (S.token && S.repo && S.pass){
    try { await loadAll(); } catch(e){ toast(e.message, true); location.hash = "#setup"; }
    if (CFG) { try { await finishFacebookLogin(); } catch(e){ toast(e.message, true); } }
  }
  render();
})();
</script>
</body>
</html>
